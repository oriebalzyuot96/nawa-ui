name: pelagic_ui
description: >-
  Accessible, themeable Flutter widgets from the Pelagic UI design system: light,
  dark and high-contrast themes with several accents, matching the web tokens.
version: 0.2.0
homepage: https://oriebalzyuot96.github.io/pelagic-ui/
repository: https://github.com/oriebalzyuot96/pelagic-ui
issue_tracker: https://github.com/oriebalzyuot96/pelagic-ui/issues
topics:
  - ui
  - design-system
  - accessibility
  - widgets
  - theme

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
